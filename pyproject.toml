[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ugc-creator"
version = "0.1.0"
description = "Local creative production with per-frame evidence, shot repair and variant selection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.20", "pydantic>=2.9,<3", "rapidocr-onnxruntime==1.4.4", "pillow>=10", "numpy>=1.26", "opencv-python>=4.9", "av>=14,<20", "websockets>=15,<18", "keyring>=25", "filelock>=3.13", "phunspell==0.1.6"]

[project.optional-dependencies]
test = ["pytest>=8", "scipy>=1.13"]
speech = ["faster-whisper>=1.1", "num2words>=0.5.14,<1"]
campaign = ["beautifulsoup4>=4.12,<5", "piper-tts>=1.3,<2"]
face-review = ["mediapipe>=0.10,<2", "scipy>=1.13", "onnxruntime>=1.19"]
product-stage = ["moderngl>=5.12,<6", "trimesh>=4.5,<6", "scipy>=1.13"]

[project.scripts]
ugc-creator = "framecraft.cli:main"
framecraft = "framecraft.cli:main"
framecraft-campaign = "framecraft.campaign:main"
framecraft-motion = "framecraft.campaign_motion:main"

[tool.setuptools.packages.find]
include = ["framecraft*"]

[tool.setuptools.package-data]
framecraft = ["graphs/*.json","static/*"]


